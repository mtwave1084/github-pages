<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブロック崩し</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #FF6B35 0%, #F7931E 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .game-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        #gameCanvas {
            border: 3px solid white;
            border-radius: 10px;
            background: #1a1a1a;
            margin: 1rem 0;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            margin: 1rem 0;
            font-size: 1.2rem;
        }

        .score, .lives {
            font-weight: bold;
        }

        .controls {
            margin: 1rem 0;
            font-size: 1rem;
            line-height: 1.5;
        }

        .game-over {
            font-size: 2rem;
            color: #ff4444;
            margin: 1rem 0;
            display: none;
        }

        .game-clear {
            font-size: 2rem;
            color: #44ff44;
            margin: 1rem 0;
            display: none;
        }

        .restart-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin: 1rem;
            transition: all 0.3s ease;
            display: none;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .back-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .start-btn {
            background: linear-gradient(45deg, #4CAF50, #45A049);
            color: white;
            border: none;
            padding: 1rem 2rem;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin: 1rem;
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🏓 ブロック崩し</h1>
        <div class="game-info">
            <div class="score">スコア: <span id="score">0</span></div>
            <div class="lives">残機: <span id="lives">3</span></div>
        </div>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <div class="controls">
            矢印キー、A/Dキー、またはマウスでパドルを移動<br>
            スペースキーでボールを発射
        </div>
        <div class="game-over" id="gameOver">ゲームオーバー！</div>
        <div class="game-clear" id="gameClear">ゲームクリア！</div>
        <button class="start-btn" id="startBtn" onclick="startGame()">ゲーム開始</button>
        <button class="restart-btn" id="restartBtn" onclick="restartGame()">再スタート</button>
        <a href="../index.html" class="back-btn">ホームに戻る</a>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let gameStarted = false;
        let gameRunning = false;
        let score = 0;
        let lives = 3;

        // パドル
        const paddle = {
            x: canvas.width / 2 - 50,
            y: canvas.height - 30,
            width: 100,
            height: 15,
            speed: 8
        };

        // ボール
        const ball = {
            x: canvas.width / 2,
            y: paddle.y - 20,
            radius: 8,
            dx: 0,
            dy: 0,
            speed: 5,
            attached: true
        };

        // ブロック
        const bricks = [];
        const brickRowCount = 5;
        const brickColumnCount = 10;
        const brickWidth = 50;
        const brickHeight = 20;
        const brickPadding = 5;
        const brickOffsetTop = 60;
        const brickOffsetLeft = 35;

        const brickColors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FECA57'];

        // キー入力
        const keys = {};

        function initBricks() {
            bricks.length = 0;
            for (let r = 0; r < brickRowCount; r++) {
                bricks[r] = [];
                for (let c = 0; c < brickColumnCount; c++) {
                    bricks[r][c] = {
                        x: c * (brickWidth + brickPadding) + brickOffsetLeft,
                        y: r * (brickHeight + brickPadding) + brickOffsetTop,
                        status: 1,
                        color: brickColors[r]
                    };
                }
            }
        }

        function drawBricks() {
            for (let r = 0; r < brickRowCount; r++) {
                for (let c = 0; c < brickColumnCount; c++) {
                    if (bricks[r][c].status === 1) {
                        const brick = bricks[r][c];
                        ctx.fillStyle = brick.color;
                        ctx.fillRect(brick.x, brick.y, brickWidth, brickHeight);
                        
                        // ブロックに光沢効果
                        const gradient = ctx.createLinearGradient(brick.x, brick.y, brick.x, brick.y + brickHeight);
                        gradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
                        gradient.addColorStop(1, 'rgba(0, 0, 0, 0.3)');
                        ctx.fillStyle = gradient;
                        ctx.fillRect(brick.x, brick.y, brickWidth, brickHeight);
                    }
                }
            }
        }

        function drawPaddle() {
            const gradient = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
            gradient.addColorStop(0, '#4CAF50');
            gradient.addColorStop(1, '#2E7D32');
            ctx.fillStyle = gradient;
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            const gradient = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 0, ball.x, ball.y, ball.radius);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(1, '#ffcc00');
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.closePath();
        }

        function drawScore() {
            document.getElementById('score').textContent = score;
            document.getElementById('lives').textContent = lives;
        }

        function collisionDetection() {
            for (let r = 0; r < brickRowCount; r++) {
                for (let c = 0; c < brickColumnCount; c++) {
                    const brick = bricks[r][c];
                    if (brick.status === 1) {
                        if (ball.x > brick.x && ball.x < brick.x + brickWidth &&
                            ball.y > brick.y && ball.y < brick.y + brickHeight) {
                            ball.dy = -ball.dy;
                            brick.status = 0;
                            score += 10;
                            
                            // 全ブロック破壊チェック
                            if (score === brickRowCount * brickColumnCount * 10) {
                                gameClear();
                            }
                        }
                    }
                }
            }
        }

        function movePaddle() {
            if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && paddle.x > 0) {
                paddle.x -= paddle.speed;
                if (ball.attached) {
                    ball.x = paddle.x + paddle.width / 2;
                }
            }
            if ((keys['ArrowRight'] || keys['d'] || keys['D']) && paddle.x < canvas.width - paddle.width) {
                paddle.x += paddle.speed;
                if (ball.attached) {
                    ball.x = paddle.x + paddle.width / 2;
                }
            }
        }

        function moveBall() {
            if (!ball.attached) {
                ball.x += ball.dx;
                ball.y += ball.dy;

                // 壁との衝突
                if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
                    ball.dx = -ball.dx;
                }
                if (ball.y + ball.dy < ball.radius) {
                    ball.dy = -ball.dy;
                }

                // パドルとの衝突
                if (ball.y + ball.dy > paddle.y - ball.radius && 
                    ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    // パドルのどこに当たったかで角度を変える
                    const hitPos = (ball.x - paddle.x) / paddle.width;
                    const angle = (hitPos - 0.5) * Math.PI / 3; // -60度から60度
                    ball.dx = Math.sin(angle) * ball.speed;
                    ball.dy = -Math.cos(angle) * ball.speed;
                }

                // ボールが下に落ちた場合
                if (ball.y + ball.dy > canvas.height - ball.radius) {
                    lives--;
                    if (lives === 0) {
                        gameOver();
                    } else {
                        resetBall();
                    }
                }
            }
        }

        function resetBall() {
            ball.x = paddle.x + paddle.width / 2;
            ball.y = paddle.y - 20;
            ball.dx = 0;
            ball.dy = 0;
            ball.attached = true;
        }

        function launchBall() {
            if (ball.attached) {
                ball.attached = false;
                ball.dx = Math.random() * 4 - 2; // -2から2の間でランダム
                ball.dy = -ball.speed;
            }
        }

        function draw() {
            // 背景をクリア
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawBricks();
            drawPaddle();
            drawBall();
            drawScore();

            if (gameRunning) {
                collisionDetection();
                movePaddle();
                moveBall();
            }
        }

        function startGame() {
            gameStarted = true;
            gameRunning = true;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('gameClear').style.display = 'none';
            document.getElementById('restartBtn').style.display = 'none';
        }

        function gameOver() {
            gameRunning = false;
            document.getElementById('gameOver').style.display = 'block';
            document.getElementById('restartBtn').style.display = 'inline-block';
        }

        function gameClear() {
            gameRunning = false;
            document.getElementById('gameClear').style.display = 'block';
            document.getElementById('restartBtn').style.display = 'inline-block';
        }

        function restartGame() {
            score = 0;
            lives = 3;
            gameStarted = false;
            gameRunning = false;
            
            paddle.x = canvas.width / 2 - 50;
            resetBall();
            initBricks();
            
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('gameClear').style.display = 'none';
            document.getElementById('restartBtn').style.display = 'none';
        }

        // マウス操作
        canvas.addEventListener('mousemove', (e) => {
            if (gameRunning) {
                const rect = canvas.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                paddle.x = mouseX - paddle.width / 2;
                
                // パドルが画面外に出ないように
                if (paddle.x < 0) paddle.x = 0;
                if (paddle.x > canvas.width - paddle.width) paddle.x = canvas.width - paddle.width;
                
                if (ball.attached) {
                    ball.x = paddle.x + paddle.width / 2;
                }
            }
        });

        canvas.addEventListener('click', () => {
            if (gameRunning && ball.attached) {
                launchBall();
            }
        });

        // キーボード操作
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === ' ') {
                e.preventDefault();
                if (gameRunning && ball.attached) {
                    launchBall();
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // ゲーム初期化
        initBricks();
        setInterval(draw, 16); // 約60FPS
    </script>
</body>
</html>
